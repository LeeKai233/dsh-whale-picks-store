name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm bundle
      - name: whale-picks spec gate
        run: |
          git clone --depth 1 https://github.com/LeeKai233/dsh-whale-picks.git /tmp/whale-picks
          (cd /tmp/whale-picks && npm install --no-audit --no-fund)
          node /tmp/whale-picks/scripts/check-plugin.mjs "$GITHUB_WORKSPACE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
